<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article Reels - Remedy Tech Zone</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#000;--border:rgba(196,232,125,0.14);--accent:#c4e87d}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);font-family:"Space Mono",monospace;color:#e8f3ee}
    .wrap{width:100%;height:100vh;display:flex;flex-direction:column}
    .reel-item{width:100%;aspect-ratio:16/9;background:#000;position:relative;border-bottom:1px solid var(--border)}
    .reel-item iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="reel-item">
      <iframe src="https://www.youtube.com/embed/Zbl4aQHAZJY" title="Remedy Tech Zone Main Reel" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
