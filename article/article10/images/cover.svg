<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit Bip 6</title>
  <desc id="desc">A dark product showcase card with a lime accent for the Amazfit Bip 6 smartwatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="640" rx="28" fill="url(#card)" stroke="#334155"/>
  <circle cx="905" cy="200" r="110" fill="#a3e635" opacity="0.12"/>
  <!-- Watch body -->
  <circle cx="280" cy="400" r="140" fill="#0f172a" stroke="#475569" stroke-width="8"/>
  <circle cx="280" cy="400" r="118" fill="#111827"/>
  <!-- Screen -->
  <circle cx="280" cy="400" r="100" fill="#1e293b"/>
  <rect x="220" y="360" width="120" height="12" rx="6" fill="#a3e635"/>
  <rect x="230" y="385" width="100" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>
  <rect x="240" y="405" width="80" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
  <!-- Strap hints -->
  <rect x="250" y="180" width="60" height="40" rx="8" fill="#1e293b"/>
  <rect x="250" y="580" width="60" height="40" rx="8" fill="#1e293b"/>
  <!-- Text side -->
  <text x="460" y="260" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Amazfit Bip 6</text>
  <text x="460" y="330" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30">Long Battery AMOLED</text>
  <text x="460" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">1.97" AMOLED • 14-Day Battery • GPS</text>
  <rect x="460" y="450" width="210" height="48" rx="24" fill="#a3e635"/>
  <text x="565" y="482" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Under $150</text>
</svg>
