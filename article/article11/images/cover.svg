<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit Active 2</title>
  <desc id="desc">A dark product showcase card with a lime accent for the Amazfit Active 2 smartwatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="640" rx="28" fill="url(#card)" stroke="#334155"/>
  <circle cx="905" cy="200" r="110" fill="#a3e635" opacity="0.12"/>
  <!-- Watch body -->
  <circle cx="280" cy="400" r="130" fill="#0f172a" stroke="#475569" stroke-width="8"/>
  <circle cx="280" cy="400" r="108" fill="#111827"/>
  <!-- Screen -->
  <circle cx="280" cy="400" r="90" fill="#1e293b"/>
  <rect x="230" y="365" width="100" height="10" rx="5" fill="#a3e635"/>
  <rect x="240" y="385" width="80" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
  <rect x="250" y="402" width="60" height="7" rx="3.5" fill="#94a3b8" opacity="0.5"/>
  <!-- Strap hints -->
  <rect x="255" y="190" width="50" height="35" rx="8" fill="#1e293b"/>
  <rect x="255" y="575" width="50" height="35" rx="8" fill="#1e293b"/>
  <!-- Text side -->
  <text x="460" y="260" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Amazfit Active 2</text>
  <text x="460" y="330" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30">Stylish GPS Tracker</text>
  <text x="460" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">AMOLED • ~10-Day Battery • Dual-band GPS</text>
  <rect x="460" y="450" width="210" height="48" rx="24" fill="#a3e635"/>
  <text x="565" y="482" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Under $150</text>
</svg>
