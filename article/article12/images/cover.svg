<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="case" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Watch body -->
  <rect x="280" y="120" width="240" height="280" rx="40" fill="url(#case)" stroke="#475569" stroke-width="4"/>
  <!-- Screen -->
  <rect x="300" y="140" width="200" height="220" rx="24" fill="url(#screen)"/>
  <!-- Screen content: time and icon -->
  <text x="400" y="230" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="#d4f8e8" text-anchor="middle">10:08</text>
  <circle cx="400" cy="280" r="20" fill="none" stroke="#6ee7b7" stroke-width="3"/>
  <path d="M390 280 L400 270 L410 280" fill="none" stroke="#6ee7b7" stroke-width="3"/>
  <!-- Strap top -->
  <rect x="340" y="60" width="120" height="70" rx="10" fill="#1e293b"/>
  <!-- Strap bottom -->
  <rect x="340" y="390" width="120" height="70" rx="10" fill="#1e293b"/>
  <!-- Side button -->
  <rect x="520" y="200" width="12" height="40" rx="4" fill="#475569"/>
  <!-- Subtle glow -->
  <circle cx="400" cy="260" r="160" fill="#059669" opacity="0.08"/>
</svg>
