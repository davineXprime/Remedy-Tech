<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="case" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Band body (slim rectangular) -->
  <rect x="300" y="140" width="200" height="220" rx="28" fill="url(#case)" stroke="#475569" stroke-width="3"/>
  <!-- Screen -->
  <rect x="318" y="158" width="164" height="170" rx="16" fill="url(#screen)"/>
  <!-- Screen content -->
  <text x="400" y="230" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#d4f8e8" text-anchor="middle">72</text>
  <text x="400" y="260" font-family="Inter, sans-serif" font-size="14" fill="#6ee7b7" text-anchor="middle">bpm</text>
  <!-- Heart icon -->
  <path d="M390 290 Q400 280 410 290 Q400 310 390 290" fill="#6ee7b7"/>
  <!-- Strap top -->
  <rect x="360" y="70" width="80" height="80" rx="12" fill="#1e293b"/>
  <!-- Strap bottom -->
  <rect x="360" y="350" width="80" height="80" rx="12" fill="#1e293b"/>
  <!-- Side button -->
  <rect x="500" y="210" width="10" height="30" rx="3" fill="#475569"/>
  <!-- Subtle glow -->
  <circle cx="400" cy="250" r="140" fill="#059669" opacity="0.08"/>
</svg>
