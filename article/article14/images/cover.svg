<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Phone body -->
  <rect x="280" y="60" width="240" height="380" rx="28" fill="url(#body)" stroke="#475569" stroke-width="3"/>
  <!-- Screen -->
  <rect x="296" y="90" width="208" height="320" rx="18" fill="url(#screen)"/>
  <!-- Camera cutout -->
  <circle cx="400" cy="118" r="8" fill="#0f172a"/>
  <!-- Subtle UI elements -->
  <rect x="320" y="150" width="160" height="12" rx="6" fill="#d4f8e8" opacity="0.3"/>
  <rect x="320" y="175" width="120" height="8" rx="4" fill="#6ee7b7" opacity="0.4"/>
  <rect x="320" y="200" width="140" height="40" rx="8" fill="#17875d" opacity="0.25"/>
  <!-- Side buttons -->
  <rect x="520" y="180" width="6" height="40" rx="2" fill="#475569"/>
  <rect x="520" y="230" width="6" height="25" rx="2" fill="#475569"/>
  <!-- Glow -->
  <circle cx="400" cy="250" r="160" fill="#059669" opacity="0.07"/>
</svg>
