<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Decorative elements -->
  <circle cx="120" cy="80" r="40" fill="#17875d" opacity="0.3"/>
  <circle cx="680" cy="420" r="60" fill="#059669" opacity="0.2"/>
  <path d="M50 200 L70 220 L90 200" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.5"/>
  <!-- Smartwatch body -->
  <g transform="translate(250, 100)">
    <!-- Strap -->
    <rect x="80" y="-40" width="140" height="40" rx="20" fill="#334155"/>
    <rect x="80" y="280" width="140" height="40" rx="20" fill="#334155"/>
    <!-- Case -->
    <rect x="40" y="0" width="220" height="280" rx="40" fill="#1e293b" stroke="#6ee7b7" stroke-width="4"/>
    <!-- Screen -->
    <rect x="55" y="20" width="190" height="240" rx="30" fill="url(#screen)"/>
    <!-- Watch face content -->
    <text x="150" y="90" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="36" font-weight="bold">10:09</text>
    <text x="150" y="120" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="14">WED 21</text>
    <!-- Heart rate ring -->
    <circle cx="100" cy="170" r="28" fill="none" stroke="#059669" stroke-width="6"/>
    <text x="100" y="175" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="12">72</text>
    <!-- Steps -->
    <circle cx="200" cy="170" r="28" fill="none" stroke="#0d9488" stroke-width="6"/>
    <text x="200" y="175" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="11">8.2k</text>
    <!-- Bottom bar -->
    <rect x="80" y="210" width="140" height="6" rx="3" fill="#059669" opacity="0.7"/>
    <!-- Buttons -->
    <rect x="260" y="80" width="12" height="40" rx="6" fill="#475569"/>
    <rect x="260" y="140" width="12" height="30" rx="6" fill="#475569"/>
  </g>
  <!-- Label -->
  <text x="400" y="460" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="18" opacity="0.8">Amazfit Bip 6</text>
</svg>
