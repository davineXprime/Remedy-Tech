<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="35" fill="#17875d" opacity="0.3"/>
  <circle cx="700" cy="430" r="55" fill="#059669" opacity="0.2"/>
  <!-- Round smartwatch -->
  <g transform="translate(300, 110)">
    <!-- Strap top -->
    <rect x="55" y="-30" width="50" height="30" rx="10" fill="#334155"/>
    <!-- Strap bottom -->
    <rect x="55" y="200" width="50" height="30" rx="10" fill="#334155"/>
    <!-- Case -->
    <circle cx="80" cy="100" r="95" fill="#1e293b" stroke="#6ee7b7" stroke-width="5"/>
    <!-- Screen -->
    <circle cx="80" cy="100" r="78" fill="url(#screen)"/>
    <!-- Watch face details -->
    <circle cx="80" cy="100" r="60" fill="none" stroke="#17875d" stroke-width="2" opacity="0.6"/>
    <text x="80" y="105" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="28" font-weight="bold">10:09</text>
    <text x="80" y="125" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="11">CMF</text>
    <!-- Metrics ring -->
    <path d="M80 40 A40 40 0 0 1 120 100" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <!-- Button -->
    <rect x="165" y="85" width="14" height="24" rx="7" fill="#475569"/>
  </g>
  <text x="400" y="460" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="18" opacity="0.8">CMF Watch 3 Pro</text>
</svg>
