<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="35" fill="#17875d" opacity="0.3"/>
  <circle cx="700" cy="430" r="55" fill="#059669" opacity="0.2"/>
  <!-- Round Galaxy Watch style -->
  <g transform="translate(280, 90)">
    <!-- Strap -->
    <rect x="70" y="-20" width="40" height="25" rx="8" fill="#334155"/>
    <rect x="70" y="195" width="40" height="25" rx="8" fill="#334155"/>
    <!-- Case -->
    <circle cx="90" cy="100" r="100" fill="#1e293b" stroke="#6ee7b7" stroke-width="6"/>
    <!-- Screen -->
    <circle cx="90" cy="100" r="82" fill="url(#screen)"/>
    <!-- Bezel accent -->
    <circle cx="90" cy="100" r="88" fill="none" stroke="#475569" stroke-width="4"/>
    <!-- Face -->
    <text x="90" y="95" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="32" font-weight="bold">10:08</text>
    <text x="90" y="115" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="12">GALAXY FE</text>
    <!-- Side button -->
    <rect x="185" y="80" width="12" height="40" rx="6" fill="#64748b"/>
  </g>
  <text x="400" y="460" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="18" opacity="0.8">Galaxy Watch FE</text>
</svg>
