<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="35" fill="#17875d" opacity="0.3"/>
  <circle cx="700" cy="430" r="55" fill="#059669" opacity="0.2"/>
  <!-- Slim Fitbit-style band -->
  <g transform="translate(280, 120)">
    <!-- Strap -->
    <rect x="55" y="-40" width="50" height="30" rx="10" fill="#334155"/>
    <rect x="55" y="210" width="50" height="30" rx="10" fill="#334155"/>
    <!-- Case -->
    <rect x="40" y="0" width="80" height="180" rx="40" fill="#1e293b" stroke="#6ee7b7" stroke-width="4"/>
    <!-- Screen -->
    <rect x="50" y="20" width="60" height="140" rx="30" fill="url(#screen)"/>
    <!-- Face -->
    <text x="80" y="85" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="28" font-weight="bold">12:58</text>
    <text x="80" y="110" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="11">INSPIRE 3</text>
    <!-- Side button -->
    <rect x="115" y="70" width="8" height="25" rx="4" fill="#64748b"/>
  </g>
  <text x="400" y="460" text-anchor="middle" fill="#d4f8e8" font-family="Arial, sans-serif" font-size="18" opacity="0.8">Fitbit Inspire 3</text>
</svg>
