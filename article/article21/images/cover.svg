<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Xiaomi Redmi Note 14</title>
  <desc id="desc">Dark-theme product hero of the Xiaomi Redmi Note 14 smartphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="url(#glow)"/>
  <rect x="280" y="120" width="320" height="560" rx="48" fill="url(#phone)" stroke="#334155" stroke-width="8"/>
  <rect x="300" y="150" width="280" height="480" rx="36" fill="url(#screen)"/>
  <circle cx="440" cy="180" r="12" fill="#0f172a"/>
  <rect x="360" y="520" width="160" height="8" rx="4" fill="#334155"/>
  <text x="700" y="280" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Redmi Note 14</text>
  <text x="700" y="340" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">6.67" 120Hz AMOLED · 108MP</text>
  <text x="700" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">5500mAh · HyperOS</text>
  <rect x="700" y="440" width="200" height="50" rx="25" fill="#a3e635"/>
  <text x="800" y="472" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Under $150</text>
</svg>
