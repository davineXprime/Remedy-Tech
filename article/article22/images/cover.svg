<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit Active 2</title>
  <desc id="desc">Dark-theme product hero of the Amazfit Active 2 smartwatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="case" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="url(#glow)"/>
  <circle cx="400" cy="400" r="180" fill="url(#case)" stroke="#64748b" stroke-width="12"/>
  <circle cx="400" cy="400" r="155" fill="url(#screen)"/>
  <circle cx="400" cy="400" r="140" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="400" y="390" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">10:28</text>
  <text x="400" y="430" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">WED OCT 28</text>
  <rect x="370" y="460" width="60" height="8" rx="4" fill="#a3e635"/>
  <text x="700" y="280" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Amazfit Active 2</text>
  <text x="700" y="340" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">1.32" 2000-nit AMOLED</text>
  <text x="700" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Up to 10-day battery · GPS</text>
  <rect x="700" y="440" width="200" height="50" rx="25" fill="#a3e635"/>
  <text x="800" y="472" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Under $150</text>
</svg>
