<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit Bip 6</title>
  <desc id="desc">Dark-theme product hero of the Amazfit Bip 6 smartwatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="case" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="380" cy="400" r="280" fill="url(#glow)"/>
  <rect x="250" y="280" width="260" height="240" rx="40" fill="url(#case)" stroke="#64748b" stroke-width="10"/>
  <rect x="270" y="300" width="220" height="200" rx="28" fill="url(#screen)"/>
  <text x="380" y="400" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" font-weight="700">10:28</text>
  <text x="380" y="440" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">WED</text>
  <rect x="350" y="470" width="60" height="8" rx="4" fill="#a3e635"/>
  <text x="680" y="280" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Amazfit Bip 6</text>
  <text x="680" y="340" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">1.97" 2000-nit AMOLED</text>
  <text x="680" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">Up to 14-day battery · GPS</text>
  <rect x="680" y="440" width="200" height="50" rx="25" fill="#a3e635"/>
  <text x="780" y="472" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Under $150</text>
</svg>
