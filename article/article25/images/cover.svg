<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Galaxy A16 5G</title>
  <desc id="desc">A clean modern smartphone hero illustration for the Galaxy A16 5G.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="100" y="90" width="1000" height="620" rx="28" fill="#0f172a" stroke="#334155"/>
  <circle cx="850" cy="220" r="120" fill="#22d3ee" opacity="0.12"/>
  <rect x="180" y="160" width="220" height="480" rx="36" fill="#0b1120" stroke="#475569"/>
