  <text x="480" y="280" fill="#f8fafc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Galaxy A16 5G</text>
  <text x="480" y="345" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">AMOLED Value Pick</text>
  <text x="480" y="400" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">6.7" 90Hz • 5,000mAh • 6-Year Updates</text>
  <rect x="480" y="460" width="240" height="52" rx="26" fill="#22d3ee"/>
  <text x="545" y="494" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Around $140</text>
