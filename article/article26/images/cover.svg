<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="watch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Band -->
  <rect x="280" y="50" width="240" height="350" rx="40" fill="#334155"/>
  <!-- Watch body -->
  <rect x="250" y="80" width="300" height="280" rx="60" fill="url(#watch)" stroke="#64748b" stroke-width="4"/>
  <!-- Screen -->
  <rect x="270" y="100" width="260" height="240" rx="40" fill="#000000"/>
  <!-- Screen content -->
  <circle cx="400" cy="220" r="80" fill="none" stroke="#06b6d4" stroke-width="6"/>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">10:09</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Amazfit Bip 6</text>
  <!-- Buttons -->
  <rect x="550" y="160" width="12" height="40" rx="4" fill="#64748b"/>
  <rect x="550" y="220" width="12" height="30" rx="4" fill="#64748b"/>
</svg>
