<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Xiaomi Redmi Note 14</title>
  <desc id="desc">Clean modern product illustration of the Xiaomi Redmi Note 14 smartphone on a dark gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="380" y="120" width="440" height="560" rx="60" fill="url(#phone)" stroke="#64748b" stroke-width="4"/>
  <!-- Screen -->
  <rect x="400" y="150" width="400" height="480" rx="40" fill="url(#screen)"/>
  <!-- Camera island -->
  <rect x="620" y="180" width="140" height="90" rx="20" fill="#0f172a" opacity="0.9"/>
  <circle cx="660" cy="210" r="18" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="710" cy="210" r="18" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="685" cy="245" r="12" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <!-- Subtle UI elements on screen -->
  <rect x="430" y="400" width="180" height="20" rx="10" fill="#ffffff" opacity="0.3"/>
  <rect x="430" y="440" width="120" height="20" rx="10" fill="#ffffff" opacity="0.2"/>
  <circle cx="580" cy="500" r="30" fill="#ffffff" opacity="0.15"/>
  <!-- Brand accent -->
  <text x="600" y="720" font-family="Inter, Arial, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle" font-weight="600">Redmi Note 14</text>
</svg>
