<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit Bip 6</title>
  <desc id="desc">A dark product showcase card with a lime accent for the Amazfit Bip 6 smartwatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="640" rx="28" fill="url(#card)" stroke="#334155"/>
  <circle cx="905" cy="200" r="110" fill="#a3e635" opacity="0.12"/>
  <!-- Watch body -->
  <rect x="190" y="220" width="180" height="220" rx="36" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <rect x="205" y="235" width="150" height="190" rx="28" fill="#0f172a"/>
  <!-- Screen content -->
  <circle cx="280" cy="310" r="40" fill="none" stroke="#a3e635" stroke-width="6"/>
  <path d="M280 280 L280 310 L300 325" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="250" y="370" width="60" height="8" rx="4" fill="#a3e635"/>
  <rect x="255" y="385" width="50" height="6" rx="3" fill="#94a3b8"/>
  <!-- Strap hints -->
  <rect x="250" y="160" width="60" height="60" rx="10" fill="#334155"/>
  <rect x="250" y="440" width="60" height="60" rx="10" fill="#334155"/>
  <text x="470" y="255" fill="#f8fafc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Amazfit Bip 6</text>
  <text x="470" y="325" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">AMOLED + Long Battery</text>
  <text x="470" y="380" fill="#94a3b8" font-family="Arial, sans-serif" font-size="26">1.97" Display • 14-Day Battery • Built-in GPS</text>
  <rect x="470" y="440" width="210" height="44" rx="22" fill="#a3e635"/>
  <text x="530" y="470" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Under $150</text>
</svg>
