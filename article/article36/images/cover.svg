<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Galaxy A16 5G</title>
  <desc id="desc">A dark product showcase card with a lime accent for the Samsung Galaxy A16 5G smartphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="640" rx="28" fill="url(#card)" stroke="#334155"/>
  <circle cx="905" cy="200" r="110" fill="#a3e635" opacity="0.12"/>
  <!-- Phone body -->
  <rect x="200" y="180" width="160" height="320" rx="28" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
  <rect x="210" y="190" width="140" height="300" rx="22" fill="#0f172a"/>
  <!-- Screen content -->
  <rect x="220" y="210" width="120" height="180" rx="8" fill="#1e3a8a" opacity="0.6"/>
  <circle cx="280" cy="260" r="20" fill="#a3e635" opacity="0.8"/>
  <rect x="240" y="300" width="80" height="8" rx="4" fill="#f8fafc"/>
  <rect x="250" y="320" width="60" height="6" rx="3" fill="#94a3b8"/>
  <!-- Camera bump -->
  <rect x="215" y="200" width="40" height="50" rx="8" fill="#334155"/>
  <circle cx="235" cy="220" r="8" fill="#64748b"/>
  <circle cx="235" cy="235" r="6" fill="#475569"/>
  <text x="430" y="255" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">Galaxy A16 5G</text>
  <text x="430" y="320" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">AMOLED + 5G Value</text>
  <text x="430" y="375" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">6.7" 90Hz • 50MP Camera • 5000mAh</text>
  <rect x="430" y="430" width="210" height="44" rx="22" fill="#a3e635"/>
  <text x="490" y="460" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Under $150</text>
</svg>
