<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Watch body -->
  <rect x="280" y="100" width="240" height="250" rx="40" ry="40" fill="#334155" stroke="#64748b" stroke-width="4"/>
  <!-- Screen -->
  <rect x="300" y="120" width="200" height="210" rx="30" ry="30" fill="url(#screen)"/>
  <!-- Watch face elements -->
  <circle cx="400" cy="225" r="70" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="400" y1="225" x2="400" y2="175" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="225" x2="450" y2="225" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="225" r="6" fill="#ffffff"/>
  <!-- Strap left -->
  <rect x="220" y="180" width="60" height="90" rx="15" fill="#475569"/>
  <!-- Strap right -->
  <rect x="520" y="180" width="60" height="90" rx="15" fill="#475569"/>
  <!-- Text -->
  <text x="400" y="400" font-family="Inter, sans-serif" font-size="28" fill="#e2e8f0" text-anchor="middle" font-weight="600">Amazfit Bip 6</text>
</svg>
