<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Galaxy A16 5G</title>
  <desc id="desc">Dark-theme product hero of the Samsung Galaxy A16 5G smartphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="url(#glow)"/>
  <rect x="90" y="70" width="1020" height="660" rx="32" fill="#0b1220" stroke="#1e293b"/>
  <rect x="220" y="120" width="240" height="480" rx="36" fill="url(#bezel)"/>
  <rect x="232" y="132" width="216" height="456" rx="28" fill="#020617"/>
  <rect x="244" y="150" width="192" height="400" rx="16" fill="url(#screen)"/>
  <circle cx="340" cy="180" r="8" fill="#1e293b"/>
  <rect x="300" y="280" width="80" height="40" rx="6" fill="#38bdf8" opacity="0.6"/>
  <text x="340" y="306" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="700">5G</text>
  <text x="340" y="480" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">AMOLED 90Hz</text>
  <text x="540" y="260" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Galaxy A16 5G</text>
  <text x="540" y="320" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">Super AMOLED · 5000mAh · 6-year updates</text>
  <text x="540" y="370" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">50MP camera · 5G · IP54</text>
  <rect x="540" y="420" width="200" height="50" rx="25" fill="#38bdf8"/>
  <text x="640" y="452" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Under $150</text>
</svg>
