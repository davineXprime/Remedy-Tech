<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Watch body -->
  <rect x="280" y="80" width="240" height="290" rx="40" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="295" y="95" width="210" height="220" rx="30" fill="url(#screen)"/>
  <!-- Screen content -->
  <text x="400" y="180" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">10:09</text>
  <text x="400" y="215" text-anchor="middle" fill="#6ee7b7" font-family="Inter, Arial, sans-serif" font-size="16">Heart Rate 72</text>
  <circle cx="400" cy="255" r="28" fill="none" stroke="#059669" stroke-width="6"/>
  <text x="400" y="260" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="14">8.2k</text>
  <text x="400" y="285" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="12">steps</text>
  <!-- Band -->
  <rect x="320" y="360" width="160" height="40" rx="20" fill="#334155"/>
  <rect x="320" y="50" width="160" height="40" rx="20" fill="#334155"/>
  <!-- Side button -->
  <rect x="520" y="180" width="12" height="40" rx="6" fill="#475569"/>
</svg>
