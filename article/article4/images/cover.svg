<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a3e635;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="280" y="80" width="240" height="440" rx="32" ry="32" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Screen -->
  <rect x="296" y="110" width="208" height="360" rx="16" ry="16" fill="url(#screen)"/>
  <!-- Notch / punch hole -->
  <circle cx="400" cy="140" r="8" fill="#0f172a"/>
  <!-- Accent bar -->
  <rect x="320" y="480" width="160" height="6" rx="3" fill="url(#accent)"/>
  <!-- Simple UI elements -->
  <rect x="320" y="180" width="160" height="12" rx="6" fill="#334155"/>
  <rect x="320" y="210" width="120" height="8" rx="4" fill="#475569"/>
  <rect x="320" y="230" width="140" height="8" rx="4" fill="#475569"/>
  <!-- Camera bump hint -->
  <rect x="500" y="100" width="40" height="40" rx="8" fill="#334155"/>
  <circle cx="520" cy="120" r="10" fill="#1e293b"/>
  <!-- Brand accent -->
  <text x="400" y="540" text-anchor="middle" fill="#a3e635" font-family="Inter, sans-serif" font-size="18" font-weight="700">Galaxy A15 5G</text>
</svg>
