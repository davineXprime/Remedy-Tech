<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Watch body circular -->
  <circle cx="400" cy="225" r="140" fill="#1e293b" stroke="#334155" stroke-width="6"/>
  <circle cx="400" cy="225" r="120" fill="url(#screen)"/>
  <!-- Screen content -->
  <text x="400" y="200" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">10:09</text>
  <text x="400" y="230" text-anchor="middle" fill="#6ee7b7" font-family="Inter, Arial, sans-serif" font-size="14">Heart Rate 72</text>
  <circle cx="400" cy="270" r="22" fill="none" stroke="#059669" stroke-width="5"/>
  <text x="400" y="275" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12">8.2k</text>
  <text x="400" y="295" text-anchor="middle" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="10">steps</text>
  <!-- Band -->
  <rect x="360" y="360" width="80" height="50" rx="25" fill="#334155"/>
  <rect x="360" y="40" width="80" height="50" rx="25" fill="#334155"/>
  <!-- Crown/button -->
  <rect x="530" y="200" width="16" height="30" rx="8" fill="#475569"/>
</svg>
