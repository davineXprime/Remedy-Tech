<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f1f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="280" y="60" width="240" height="330" rx="32" fill="url(#body)" stroke="#475569" stroke-width="3"/>
  <!-- Screen -->
  <rect x="295" y="75" width="210" height="300" rx="20" fill="url(#screen)"/>
  <!-- Notch/punch hole -->
  <circle cx="400" cy="95" r="8" fill="#0f172a"/>
  <!-- Screen content -->
  <text x="400" y="180" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Galaxy</text>
  <text x="400" y="215" text-anchor="middle" fill="#6ee7b7" font-family="Inter, Arial, sans-serif" font-size="18">A16 5G</text>
  <rect x="340" y="250" width="120" height="6" rx="3" fill="#334155"/>
  <rect x="355" y="270" width="90" height="6" rx="3" fill="#475569"/>
  <!-- Camera module -->
  <rect x="310" y="85" width="50" height="40" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="325" cy="100" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="345" cy="105" r="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <!-- Side button -->
  <rect x="520" y="180" width="6" height="40" rx="3" fill="#64748b"/>
</svg>
