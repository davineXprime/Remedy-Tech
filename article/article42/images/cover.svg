<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit Active 2</title>
  <desc id="desc">Dark-theme product hero of the Amazfit Active 2 round smartwatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="430" cy="400" r="260" fill="url(#glow)"/>
  <rect x="90" y="70" width="1020" height="660" rx="32" fill="#0b1220" stroke="#1e293b"/>
  <circle cx="390" cy="400" r="150" fill="url(#bezel)"/>
  <circle cx="390" cy="400" r="132" fill="#020617"/>
  <circle cx="390" cy="400" r="112" fill="url(#screen)"/>
  <circle cx="390" cy="400" r="70" fill="none" stroke="#a3e635" stroke-width="8"/>
  <circle cx="390" cy="400" r="48" fill="none" stroke="#34d399" stroke-width="5" stroke-dasharray="60 30"/>
  <text x="390" y="408" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="700">10d</text>
  <text x="390" y="470" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">GPS · 68 bpm</text>
  <text x="620" y="250" fill="#f8fafc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Amazfit Active 2</text>
  <text x="620" y="318" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">AMOLED · GPS · 10-day battery</text>
  <text x="620" y="378" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">Round design · Health tracking</text>
  <rect x="620" y="430" width="230" height="54" rx="27" fill="#a3e635"/>
  <text x="735" y="465" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Under $150</text>
</svg>
