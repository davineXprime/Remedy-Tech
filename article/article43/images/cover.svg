<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Galaxy A16</title>
  <desc id="desc">Dark-theme product hero of the Samsung Galaxy A16 smartphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="380" cy="400" r="280" fill="url(#glow)"/>
  <rect x="90" y="70" width="1020" height="660" rx="32" fill="#0b1220" stroke="#1e293b"/>
  <rect x="250" y="160" width="220" height="480" rx="28" fill="#1e293b"/>
  <rect x="262" y="172" width="196" height="456" rx="22" fill="url(#screen)"/>
  <circle cx="360" cy="200" r="8" fill="#0f172a"/>
  <rect x="340" y="560" width="40" height="6" rx="3" fill="#0f172a" opacity="0.6"/>
  <text x="560" y="280" fill="#f8fafc" font-family="Arial, sans-serif" font-size="58" font-weight="700">Galaxy A16</text>
  <text x="560" y="348" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">6.7" Super AMOLED · 90Hz</text>
  <text x="560" y="408" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">6 years of updates · 5000mAh</text>
  <rect x="560" y="460" width="230" height="54" rx="27" fill="#34d399"/>
  <text x="675" y="495" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Under $150</text>
</svg>
