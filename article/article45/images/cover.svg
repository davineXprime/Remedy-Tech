<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Amazfit GTS 4 Mini</title>
  <desc id="desc">Dark-theme product hero of the Amazfit GTS 4 Mini smartwatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="280" fill="url(#glow)"/>
  <rect x="90" y="70" width="1020" height="660" rx="32" fill="#0b1220" stroke="#1e293b"/>
  <rect x="280" y="180" width="220" height="280" rx="40" fill="url(#bezel)"/>
  <rect x="292" y="192" width="196" height="256" rx="32" fill="#020617"/>
  <rect x="304" y="204" width="172" height="220" rx="20" fill="url(#screen)"/>
  <circle cx="390" cy="250" r="6" fill="#1e293b"/>
  <rect x="340" y="300" width="100" height="30" rx="6" fill="#38bdf8" opacity="0.6"/>
  <text x="390" y="320" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="700">GPS</text>
  <text x="390" y="400" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">AMOLED</text>
  <text x="560" y="280" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">GTS 4 Mini</text>
  <text x="560" y="340" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">Compact AMOLED · 15-day battery · GPS</text>
  <text x="560" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">120+ modes · Health tracking · 5 ATM</text>
  <rect x="560" y="430" width="180" height="48" rx="24" fill="#38bdf8"/>
  <text x="650" y="460" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Under $150</text>
</svg>
