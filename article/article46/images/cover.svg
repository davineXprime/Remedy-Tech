<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="280" y="40" width="240" height="370" rx="28" fill="url(#phone)" stroke="#64748b" stroke-width="4"/>
  <!-- Screen -->
  <rect x="295" y="55" width="210" height="330" rx="18" fill="url(#screen)"/>
  <!-- Notch / punch hole -->
  <circle cx="400" cy="70" r="6" fill="#0f172a"/>
  <!-- Camera module -->
  <rect x="500" y="70" width="50" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="515" cy="90" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="535" cy="90" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="525" cy="115" r="6" fill="#475569"/>
  <!-- Brand text -->
  <text x="400" y="430" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Redmi 15</text>
</svg>
