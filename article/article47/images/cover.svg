<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="280" y="60" width="240" height="380" rx="28" ry="28" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Screen -->
  <rect x="295" y="80" width="210" height="340" rx="18" ry="18" fill="url(#screen)"/>
  <!-- Camera notch -->
  <rect x="380" y="70" width="40" height="12" rx="6" fill="#0f172a"/>
  <!-- Camera module -->
  <rect x="310" y="100" width="50" height="70" rx="12" fill="#0f172a" opacity="0.6"/>
  <circle cx="335" cy="125" r="10" fill="#64748b"/>
  <circle cx="335" cy="150" r="8" fill="#475569"/>
  <!-- Simple UI elements -->
  <rect x="320" y="200" width="160" height="8" rx="4" fill="#ffffff" opacity="0.8"/>
  <rect x="320" y="220" width="120" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="340" cy="280" r="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="380" cy="280" r="12" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="280" r="12" fill="#ffffff" opacity="0.7"/>
  <circle cx="460" cy="280" r="12" fill="#ffffff" opacity="0.7"/>
</svg>
