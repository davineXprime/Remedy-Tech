<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Watch body -->
  <rect x="280" y="80" width="240" height="280" rx="40" ry="40" fill="url(#body)" stroke="#64748b" stroke-width="3"/>
  <!-- Screen -->
  <rect x="295" y="95" width="210" height="250" rx="28" ry="28" fill="url(#screen)"/>
  <!-- Time display simulation -->
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">10:09</text>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.9" text-anchor="middle">STEPS 8421</text>
  <!-- Heart rate icon area -->
  <circle cx="340" cy="270" r="8" fill="#ffffff" opacity="0.8"/>
  <text x="360" y="275" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.9">72</text>
  <!-- Strap left -->
  <rect x="200" y="160" width="80" height="120" rx="15" fill="#475569"/>
  <!-- Strap right -->
  <rect x="520" y="160" width="80" height="120" rx="15" fill="#475569"/>
  <!-- Buckle hint -->
  <rect x="560" y="200" width="20" height="40" rx="4" fill="#64748b"/>
</svg>
