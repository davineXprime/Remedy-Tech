<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="280" y="60" width="240" height="380" rx="30" ry="30" fill="url(#body)" stroke="#64748b" stroke-width="3"/>
  <!-- Screen -->
  <rect x="295" y="80" width="210" height="340" rx="22" ry="22" fill="url(#screen)"/>
  <!-- Notch/camera cutout -->
  <circle cx="400" cy="100" r="8" fill="#0f172a"/>
  <!-- App icons simulation -->
  <circle cx="340" cy="200" r="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="380" cy="200" r="12" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="200" r="12" fill="#ffffff" opacity="0.8"/>
  <circle cx="460" cy="200" r="12" fill="#ffffff" opacity="0.6"/>
  <!-- Bottom bar -->
  <rect x="360" y="380" width="80" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
</svg>
