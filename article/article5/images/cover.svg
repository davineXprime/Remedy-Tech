<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Strap left -->
  <rect x="280" y="80" width="40" height="290" rx="20" fill="#334155"/>
  <!-- Strap right -->
  <rect x="480" y="80" width="40" height="290" rx="20" fill="#334155"/>
  <!-- Watch case -->
  <circle cx="400" cy="225" r="110" fill="#e2e8f0" filter="url(#shadow)"/>
  <circle cx="400" cy="225" r="95" fill="#1e293b"/>
  <!-- Screen -->
  <circle cx="400" cy="225" r="80" fill="url(#screen)"/>
  <!-- Simple watch face elements -->
  <circle cx="400" cy="225" r="4" fill="#fff"/>
  <line x1="400" y1="225" x2="400" y2="160" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="225" x2="450" y2="225" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Brand text subtle -->
  <text x="400" y="420" font-family="Inter, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Amazfit Active 2</text>
</svg>
