<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Watch body -->
  <g transform="translate(250, 80)" filter="url(#shadow)">
    <!-- Strap upper -->
    <path d="M140 20 Q180 0 220 20 L230 50 L130 50 Z" fill="#1f2937"/>
    <path d="M145 25 Q180 8 215 25" fill="none" stroke="#374151" stroke-width="3"/>
    <!-- Case -->
    <rect x="100" y="50" width="200" height="240" rx="40" fill="#374151" stroke="#6b7280" stroke-width="4"/>
    <!-- Screen -->
    <rect x="115" y="65" width="170" height="210" rx="28" fill="url(#screen)"/>
    <!-- Screen content -->
    <text x="200" y="140" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    <text x="200" y="190" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#e5e7eb" text-anchor="middle">09</text>
    <text x="200" y="230" font-family="Arial, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Steps 12,003</text>
    <circle cx="160" cy="250" r="4" fill="#ef4444"/>
    <text x="175" y="255" font-family="Arial, sans-serif" font-size="12" fill="#f87171">85 BPM</text>
    <!-- Strap lower with holes -->
    <path d="M130 290 L140 360 Q180 380 220 360 L230 290 Z" fill="#1f2937"/>
    <circle cx="165" cy="330" r="5" fill="#111827"/>
    <circle cx="185" cy="330" r="5" fill="#111827"/>
    <circle cx="205" cy="330" r="5" fill="#111827"/>
    <circle cx="175" cy="345" r="5" fill="#111827"/>
    <circle cx="195" cy="345" r="5" fill="#111827"/>
    <!-- Button -->
    <rect x="300" y="140" width="12" height="40" rx="6" fill="#6b7280"/>
    <rect x="300" y="190" width="12" height="20" rx="6" fill="#6b7280"/>
  </g>
  <!-- Subtle accent -->
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Amazfit Bip 6</text>
</svg>
