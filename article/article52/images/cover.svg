<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Phone body -->
  <g transform="translate(280, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="380" rx="36" fill="#1f2937" stroke="#4b5563" stroke-width="3"/>
    <rect x="12" y="18" width="216" height="344" rx="28" fill="url(#screen)"/>
    <!-- Notch -->
    <rect x="90" y="18" width="60" height="18" rx="9" fill="#111827"/>
    <!-- Screen content -->
    <text x="120" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Galaxy</text>
    <text x="120" y="200" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#e0f2fe" text-anchor="middle">A16</text>
    <text x="120" y="240" font-family="Arial, sans-serif" font-size="14" fill="#bae6fd" text-anchor="middle">Super AMOLED</text>
    <!-- Camera module -->
    <rect x="18" y="40" width="48" height="70" rx="12" fill="#111827"/>
    <circle cx="42" cy="60" r="10" fill="#374151"/>
    <circle cx="42" cy="85" r="8" fill="#374151"/>
    <circle cx="42" cy="100" r="5" fill="#6b7280"/>
  </g>
  <!-- Subtle accent -->
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Samsung Galaxy A16</text>
</svg>
