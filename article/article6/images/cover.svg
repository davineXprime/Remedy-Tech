<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Band left -->
  <rect x="250" y="120" width="50" height="210" rx="25" fill="#334155"/>
  <!-- Band right -->
  <rect x="500" y="120" width="50" height="210" rx="25" fill="#334155"/>
  <!-- Tracker body -->
  <rect x="300" y="140" width="200" height="170" rx="30" fill="#e2e8f0" filter="url(#shadow)"/>
  <rect x="315" y="155" width="170" height="140" rx="20" fill="#1e293b"/>
  <!-- Screen -->
  <rect x="330" y="170" width="140" height="110" rx="12" fill="url(#screen)"/>
  <!-- Simple display elements -->
  <circle cx="400" cy="225" r="3" fill="#fff"/>
  <line x1="400" y1="225" x2="400" y2="195" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="400" y1="225" x2="425" y2="225" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Brand text -->
  <text x="400" y="400" font-family="Inter, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Fitbit Charge 6</text>
</svg>
