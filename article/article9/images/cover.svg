<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Galaxy A16 5G</title>
  <desc id="desc">A dark product showcase card with a lime accent for the Samsung Galaxy A16 5G smartphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="640" rx="28" fill="url(#card)" stroke="#334155"/>
  <circle cx="905" cy="200" r="110" fill="#a3e635" opacity="0.12"/>
  <!-- Phone body -->
  <rect x="160" y="160" width="240" height="480" rx="36" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  <rect x="178" y="180" width="204" height="440" rx="28" fill="#111827"/>
  <!-- Screen content -->
  <rect x="198" y="210" width="164" height="280" rx="16" fill="#1e293b"/>
  <circle cx="280" cy="320" r="36" fill="#a3e635" opacity="0.25"/>
  <rect x="230" y="370" width="100" height="8" rx="4" fill="#a3e635"/>
  <rect x="230" y="390" width="80" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>
  <!-- Camera punch -->
  <circle cx="280" cy="200" r="6" fill="#475569"/>
  <!-- Text side -->
  <text x="460" y="260" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="700">Galaxy A16 5G</text>
  <text x="460" y="330" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30">Smooth AMOLED Value</text>
  <text x="460" y="390" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">6.7" AMOLED • 5,000mAh • Multi-Year Updates</text>
  <rect x="460" y="450" width="210" height="48" rx="24" fill="#a3e635"/>
  <text x="565" y="482" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Under $150</text>
</svg>
