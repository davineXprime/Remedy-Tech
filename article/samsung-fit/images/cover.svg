  <desc id="desc">A sleek AMOLED fitness band showcase card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="110" y="90" width="980" height="620" rx="30" fill="#0f172a" stroke="#334155"/>
