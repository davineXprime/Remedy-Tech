<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#dcfce7"/>
  
  <!-- Generator Base -->
  <rect x="80" y="140" width="240" height="100" rx="8" fill="#1f2937"/>
  
  <!-- Generator Body -->
  <rect x="100" y="80" width="200" height="70" rx="8" fill="#22c55e"/>
  
  <!-- Generator Front Panel -->
  <rect x="110" y="100" width="180" height="40" fill="#374151" rx="4"/>
  
  <!-- Display Screen -->
  <rect x="125" y="110" width="150" height="25" fill="#1f2937" rx="2"/>
  <text x="202" y="130" font-size="16" fill="#22c55e" font-weight="bold" text-anchor="middle">9.5kW</text>
  
  <!-- Control Knobs -->
  <circle cx="145" cy="165" r="12" fill="#f97316"/>
  <circle cx="145" cy="165" r="8" fill="#ea580c"/>
  
  <circle cx="255" cy="165" r="12" fill="#f97316"/>
  <circle cx="255" cy="165" r="8" fill="#ea580c"/>
  
  <!-- Fuel Tank Indicator -->
  <rect x="200" y="155" width="35" height="20" fill="#22c55e" rx="3"/>
  <text x="217.5" y="169" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="middle">FUEL</text>
  
  <!-- Power Outlet -->
  <circle cx="120" cy="205" r="15" fill="#f97316"/>
  <circle cx="120" cy="205" r="10" fill="#ea580c"/>
  <text x="120" y="212" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">⚡</text>
  
  <!-- Handle -->
  <path d="M 150 75 Q 200 40 250 75" stroke="#1f2937" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Features Label -->
  <text x="200" y="270" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="middle">Tri-Fuel Portable Generator</text>
  
  <!-- Accent Lines -->
  <rect x="85" y="138" width="230" height="3" fill="#f97316" rx="1.5"/>
</svg>