<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remedy Tech Zone</title>

  <!-- ALL CSS HERE -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fafafa;
      color: #333;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #dfe9f3, #fcefe3);
    }

    h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #333;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 20px;
    }

    #article-container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Remedy Tech Zone</h1>
    <p>The Field Guide for Better Tools</p>
    <button class="button" id="loadArticleBtn">Load Article</button>
  </header>

  <!-- Article loads here -->
  <div id="article-container"></div>

  <!-- ALL JAVASCRIPT HERE -->
  <script>
    document.getElementById("loadArticleBtn").addEventListener("click", () => {
      fetch("./article.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("article-container").innerHTML = html;
        })
        .catch(err => {
          document.getElementById("article-container").innerHTML =
            "<p style='color:red;'>Could not load article.</p>";
          console.error(err);
        });
    });
  </script>

</body>
</html>
