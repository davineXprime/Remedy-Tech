<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remedy Tech Zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MP4 Background Video -->
  <div class="video-background">
    <video autoplay loop muted playsinline id="bg-video">
      <source src="background.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Main Layout Container -->
  <div class="app-container">
    
    <!-- Left Navigation Sidebar -->
    <nav class="sidebar">
      <div class="logo">
        <h2>Remedy Tech</h2>
        <span>zone</span>
      </div>
      <ul class="nav-links">
        <li><a href="#" class="active" onclick="loadArticle('articles/latest-article.html')">Articles</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#privacy">Privacy &amp; Compliance</a></li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
      <h1 class="section-title">- Articles -</h1>
      
      <!-- Dynamic Article Container (Loaded via JS) -->
      <div id="article-container" class="article-card-wrapper">
        <p>Loading today's article...</p>
      </div>

      <div class="footer-link">
        <a href="#all-articles">Read More Articles &rarr;</a>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
